name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Archive validation
        run: bun run archive:validate

      - name: Provenance audit report
        run: bun run archive:provenance-report

      - name: Archive data quality audit
        run: bun run archive:quality

      - name: Media preservation audit
        run: bun run archive:media

      - name: Consolidated archive QA
        run: bun run archive:qa

      - name: Editorial workflow report
        run: bun run archive:editorial

      - name: Public export contract
        run: bun run archive:export > /tmp/archive-export.json

      - name: Archive foundation regression tests
        run: bun run test:archive

      - name: Canonical record route regression tests
        run: bun run test:archive-records

      - name: Full regression test suite
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Client performance budget
        run: bun run test:performance-budget

      - name: Localhost HTTP runtime smoke
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/mithila-vite.log 2>&1 &
          echo $! > /tmp/mithila-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          bun run test:http-smoke
          kill $(cat /tmp/mithila-vite.pid) || true

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Chromium accessibility and performance audit
        run: bun run test:browser-audit

      - name: Lint
        run: bun run lint
